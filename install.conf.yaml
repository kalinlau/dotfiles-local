- defaults:
    link:
      create: true
      relink: true

- clean: 
    ~/:
      force: true
    ~/.config:
      recursive: true

- link:
    ~/.bashrc_local_after:
    ~/.fzf:
    ~/.gitconfig_local:
    ~/.shell_local_before:
    ~/.ssh: 
    ~/.vimrc_local:
    ~/.config/youtube-dl/config: youtube-dl.conf
    ~/.zshrc_local_after:
    ~/.pylintrc:

- shell:
    - [git submodule sync --recursive, sync remote submodule config to local .gitmodules]
    - git update-submodules
