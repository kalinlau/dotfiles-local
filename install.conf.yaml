- defaults:
    link:
      create: true
      relink: true
- clean:
    ~/:
      force: true
    ~/.config:
      force: true
      recursive: true
- link:
    ~/.bashrc_local_after:
    ~/.config/markdownlint/markdownlintrc:
    ~/.config/youtube-dl/config: youtube-dl.conf
    ~/.config/vale/.vale.ini:
    ~/.env: gemini_env
    ~/.gitconfig_local:
    ~/.gemini/settings.json:
    ~/.pylintrc:
    ~/.shell_local_before:
    ~/.ssh:
    ~/.vimrc_local:
    ~/.zshrc_local_after:
- shell:
    - git submodule sync --recursive
    - git update-submodules
